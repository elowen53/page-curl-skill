name: Test
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'package.json'
      - '.gitattributes'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
